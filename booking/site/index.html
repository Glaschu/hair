<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Book an appointment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=DM+Mono&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg:#FAF6F0; --bg2:#F3ECE3; --card:#fff; --ink:#2A201A; --ink2:#6B5B4E;
    --ink3:#A8978A; --line:rgba(42,32,26,.1); --accent:#C26E4A; --sage:#6B7B5C; --warn:#C07E2A;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"DM Sans",system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    padding:28px 20px calc(40px + env(safe-area-inset-bottom));
  }
  main { max-width:440px; margin:0 auto; display:flex; flex-direction:column; gap:24px; }
  .serif { font-family:"Cormorant Garamond",Georgia,serif; font-style:italic; letter-spacing:-.01em; line-height:1.1; }
  .eyebrow { font-size:10px; letter-spacing:1.4px; font-weight:500; text-transform:uppercase; color:var(--ink3); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px 18px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .dot { width:9px; height:9px; border-radius:5px; background:var(--accent); }
  h1 { margin:0; font-size:34px; font-weight:400; }
  p { margin:0; line-height:1.55; color:var(--ink2); font-size:15.5px; }
  .day { display:flex; flex-direction:column; gap:10px; }
  .times { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
  button.slot {
    min-height:48px; border-radius:12px; background:var(--card); border:1px solid var(--line);
    font:500 15px "DM Sans",sans-serif; color:var(--ink); cursor:pointer;
  }
  button.slot[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  label { display:flex; flex-direction:column; gap:7px; }
  input, textarea {
    font:400 16px "DM Sans",sans-serif; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:14px 16px; min-height:52px; width:100%;
  }
  textarea { min-height:84px; resize:vertical; }
  .primary {
    display:flex; align-items:center; justify-content:center; min-height:52px; border:0;
    border-radius:14px; background:var(--accent); color:#fff; font:600 15px "DM Sans",sans-serif;
    cursor:pointer; width:100%;
  }
  .primary[disabled] { opacity:.45; cursor:default; }
  .note { display:flex; gap:11px; background:var(--bg2); border-radius:14px; padding:14px 16px; font-size:13px; color:var(--ink2); line-height:1.5; }
  .error { background:rgba(184,64,64,.1); color:#8E2F2F; border-radius:14px; padding:14px 16px; font-size:14px; }
  .hidden { display:none; }
  .ghostlink { background:none; border:0; color:var(--ink2); font:500 14px "DM Sans",sans-serif;
               text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:6px; }
  .ghostlink:hover { color:var(--accent); }
  .policy { background:var(--bg2); border-radius:16px; padding:18px 18px 16px; }
  .policy-text { font-size:14px; line-height:1.6; color:var(--ink2); white-space:pre-line; }
  .agree { flex-direction:row; align-items:flex-start; gap:10px; margin-top:14px;
           font-size:14px; line-height:1.45; color:var(--ink); cursor:pointer; }
  .agree input { width:20px; height:20px; flex-shrink:0; margin:1px 0 0; accent-color:var(--accent); }
  .tick { width:62px; height:62px; border-radius:31px; background:rgba(107,123,92,.18); display:flex; align-items:center; justify-content:center; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="dot"></span><span class="serif" style="font-size:26px" id="salon">…</span></div>
  <div id="view"><p>Getting your times…</p></div>
</main>

<script src="/vendor/nacl-fast.min.js"></script>
<script src="/book.js"></script>
</body>
</html>
