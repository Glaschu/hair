# Deploys the booking service. Manual by default.
#
# Nothing here runs on a push. The thing being deployed takes deposits, and a
# pipeline that ships on every merge to main is one bad merge away from a
# booking page that cannot take a booking. Ship deliberately.
name: deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        required: true
        default: rules-and-indexes
        type: choice
        options:
          - rules-and-indexes   # safe: no downtime, no data change
          - hosting             # the booking and setup pages
          - functions           # the API, webhook and refund schedule
          - everything          # all of the above: rules, functions, then pages
      environment:
        description: Which project
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  # One deploy at a time per environment. Two concurrent rules deploys is a
  # coin toss over which ruleset survives.
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify before shipping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - run: npm ci
        working-directory: firebase
      - run: npx jest --ci
      - run: node --test booking/test/integration.test.mjs
      - run: npm test
        working-directory: firebase
      # The same gate as local: refuses if money is a float, a claim is read
      # unsafely, or a query has no index.
      - run: scripts/preflight.sh

  deploy:
    name: deploy to ${{ inputs.environment }}
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
        working-directory: firebase

      - name: point at the project
        run: |
          npx firebase use "${{ vars.FIREBASE_PROJECT_ID }}" --token "${{ secrets.FIREBASE_TOKEN }}"
        working-directory: firebase

      # Rules and indexes first, and on their own by default. They are the only
      # part that can be rolled back by redeploying the previous commit with no
      # other consequence.
      - name: firestore rules and indexes
        if: inputs.target == 'rules-and-indexes' || inputs.target == 'everything'
        run: npx firebase deploy --only firestore:rules,firestore:indexes --non-interactive
        working-directory: firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Functions before the pages: a new page talking to old server code is a
      # booking page that breaks, while old pages on new functions keep working.
      # The secrets they declare must already exist in the project, or this
      # step fails — which is the right place for it to fail.
      # The CLI loads the functions' code to see what to deploy, so their own
      # dependencies have to be installed here too.
      - name: functions' dependencies
        if: inputs.target == 'functions' || inputs.target == 'everything'
        run: npm ci
        working-directory: firebase/functions

      - name: functions
        if: inputs.target == 'functions' || inputs.target == 'everything'
        run: npx firebase deploy --only functions --non-interactive
        working-directory: firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: hosting
        if: inputs.target == 'hosting' || inputs.target == 'everything'
        run: npx firebase deploy --only hosting --non-interactive
        working-directory: firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # A deploy that "succeeded" onto a page that will not load is not a
      # deploy. Ask the live site, not the tool.
      - name: is it answering?
        if: inputs.target != 'rules-and-indexes'
        run: |
          site="https://${{ vars.FIREBASE_PROJECT_ID }}.web.app"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$site/api/version"
          for page in /setup /guide; do
            curl --fail --silent --show-error --retry 3 --retry-delay 5 -o /dev/null "$site$page"
          done

      - name: what went out
        run: |
          echo "### Deployed to ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- target: \`${{ inputs.target }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- project: \`${{ vars.FIREBASE_PROJECT_ID }}\`" >> "$GITHUB_STEP_SUMMARY"
